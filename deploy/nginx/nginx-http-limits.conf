# Put this file inside the nginx http { ... } block.
# Example:
#   include /etc/nginx/snippets/stockfirm-http-limits.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Basic per-IP anti-abuse zones.
limit_req_zone $binary_remote_addr zone=stockfirm_general:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stockfirm_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=stockfirm_api:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=stockfirm_conn:20m;

