<!DOCTYPE html>
{% load static %}
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFirm CRM - Tizimga kirish</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Kirish - StockFirm CRM</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-600: #475569;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--slate-50);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: var(--slate-900);
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--slate-200);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-box {
            width: 132px;
            height: 96px;
            background: transparent;
            color: inherit;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: none;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            color: var(--slate-900);
        }

        .login-header p {
            color: var(--slate-600);
            font-size: 0.9375rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--slate-800);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-400);
            font-size: 1rem;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            background: var(--slate-50);
            border: 1.5px solid var(--slate-200);
            border-radius: 0.875rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--slate-900);
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-input:focus + .input-icon {
            color: var(--primary);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.875rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            opacity: 0.8;
            cursor: wait;
        }

        .error-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            padding: 1rem;
            border-radius: 0.875rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            color: #be123c;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--slate-600);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2.5rem 1.5rem;
                border-radius: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-box">
                <img src="{% static 'brand/logo-st-mark.svg' %}" alt="StockFirm ST logo">
            </div>
            <h1>StockFirm CRM</h1>
            <p>Xush kelibsiz! Tizimga kiring.</p>
        </div>

        {% if messages %}
        <div class="error-box">
            <i class="fas fa-circle-exclamation" style="margin-top: 2px;"></i>
            <div>
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <form method="POST" onsubmit="handleSubmit(event)">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="username">Foydalanuvchi nomi</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-input" 
                        placeholder="Username kiriting" required autocomplete="username"
                        value="{{ username }}">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Parol</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" 
                        placeholder="Parol kiriting" required autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Kirish</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer">
            &copy; 2026 StockFirm CRM. Barcha huquqlar himoyalangan.
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            const btn = document.getElementById('loginBtn');
            const span = btn.querySelector('span');
            const icon = btn.querySelector('i');
            
            btn.classList.add('loading');
            span.textContent = 'Kirilmoqda...';
            icon.className = 'fas fa-spinner fa-spin';
        }

        // Auto-focus logic
        window.onload = () => {
            const userInp = document.getElementById('username');
            if (!userInp.value) userInp.focus();
            else document.getElementById('password').focus();
        };
    </script>
</body>

</html>
