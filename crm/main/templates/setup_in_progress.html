<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizim sozlanmoqda - StockFirm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }
        .container {
            text-align: center;
            background: var(--card);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .loader-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .admin-note {
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader-icon"><i class="fa-solid fa-gears"></i></div>
        <h1>Tizim sozlanmoqda</h1>
        <p><strong>{{ company.name }}</strong> admini hozirda tizimni ishga tushirish uchun sozlash ishlarini olib bormoqda. Tez orada xizmat ko'rsatish boshlanadi.</p>
        
        <div class="admin-note">
            <i class="fa-solid fa-circle-info" style="margin-right: 8px;"></i>
            Hozirda tizimga faqat korxona rahbari ruxsatiga ega.
        </div>

        <a href="/login" class="btn">Kirish (Rahbarlar uchun)</a>
    </div>
</body>
</html>
