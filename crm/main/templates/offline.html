<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — StockFirm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #334155;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #059669; }
        .queue-info {
            margin-top: 20px;
            padding: 12px 16px;
            background: #0f172a;
            border-radius: 10px;
            font-size: 13px;
            color: #64748b;
        }
        #queueCount { color: #f59e0b; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">📡</span>
        <h1>Internet aloqasi yo'q</h1>
        <p>Siz hozir offline rejimdasiz. GPS nuqtalaringiz qurilmada saqlanmoqda va internet qayta tiklanganda avtomatik yuboriladi.</p>

        <div class="status">
            <div class="dot"></div>
            <span id="statusText">Offline</span>
        </div>

        <a href="/" class="btn" onclick="window.location.reload()">Qayta urinish</a>

        <div class="queue-info">
            Yuborilmagan GPS nuqtalar: <span id="queueCount">—</span> ta
        </div>
    </div>

    <script>
        // Queue hajmini IndexedDB dan o'qish
        async function loadQueueCount() {
            try {
                const req = indexedDB.open('stockfirm_location_db', 1);
                req.onsuccess = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('location_queue')) {
                        document.getElementById('queueCount').textContent = '0';
                        return;
                    }
                    const r = db.transaction('location_queue', 'readonly')
                                .objectStore('location_queue').count();
                    r.onsuccess = () => {
                        document.getElementById('queueCount').textContent = r.result;
                    };
                };
            } catch(e) {
                document.getElementById('queueCount').textContent = '?';
            }
        }

        window.addEventListener('online', () => {
            document.getElementById('statusText').textContent = 'Online — qayta yo\'naltirilmoqda...';
            document.querySelector('.dot').style.background = '#10b981';
            setTimeout(() => window.location.href = '/', 1200);
        });

        loadQueueCount();
        setInterval(loadQueueCount, 5000);
    </script>
</body>
</html>
