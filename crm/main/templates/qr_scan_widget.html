<!-- Umumiy QR-skaner vidjeti: sotish shablonlariga (ytsot.html, sgsot.html) include qilinadi.
     Matn maydoni readonly — faqat kamera orqali to'ldiriladi, qo'lda yozib
     bo'lmaydi (soxta/begona QR kod kiritilmasligi uchun). Xato skanerlangan
     donani "Oxirgisini o'chirish" tugmasi bilan bekor qilish mumkin. -->
<div id="qrScanModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.75); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:18px; width:min(92vw, 420px);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong>QR kodni skanerlang</strong>
            <button type="button" onclick="closeQrScanModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <div id="qrScanReaderBox" style="width:100%;"></div>
        <div id="qrScanStatus" style="min-height:20px; margin-top:10px; font-size:13px; font-weight:700;"></div>
        <p style="font-size:12px; color:#64748b; margin-top:4px;">Faqat kamera orqali skanerlanadi — qo'lda kiritish o'chirilgan. Kamera ishlamasa, administrator bilan bog'laning.</p>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
    const CHECK_SALE_SERIAL_URL = "{% url 'check_sale_serial' %}";

    let qrScanTargetId = null;
    let qrScanIdx = null;
    let qrScanMahsulotId = null;
    let html5QrCode = null;
    let validating = false;

    function extractKod(decodedText) {
        try {
            const url = new URL(decodedText);
            const parts = url.pathname.split('/').filter(Boolean);
            return parts[parts.length - 1] || decodedText;
        } catch (e) {
            return decodedText.trim();
        }
    }

    function setStatus(text, color) {
        const el = document.getElementById('qrScanStatus');
        if (el) {
            el.style.color = color;
            el.textContent = text;
        }
    }

    function getCodes(targetId) {
        const textarea = document.getElementsByName(targetId)[0];
        return textarea
            ? textarea.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
            : [];
    }

    function setCodes(targetId, codes) {
        const textarea = document.getElementsByName(targetId)[0];
        if (textarea) textarea.value = codes.join('\n');
    }

    // Har bir skanerlangan kodni × tugmasi bilan alohida o'chirish mumkin
    // bo'lgan ro'yxat sifatida chizadi.
    function renderScannedList(idx, targetId) {
        const list = document.getElementById('scannedList' + idx);
        if (!list) return;
        const codes = getCodes(targetId);
        list.innerHTML = '';
        codes.forEach(function (kod) {
            const kodQisqa = kod.length > 10 ? kod.slice(0, 10) + '…' : kod;
            const item = document.createElement('div');
            item.style.cssText = 'display:flex; align-items:center; gap:8px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:6px 8px; font-size:12px;';
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.textContent = '×';
            delBtn.style.cssText = 'flex-shrink:0; width:22px; height:22px; line-height:20px; border:1px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:6px; font-weight:800; cursor:pointer; padding:0;';
            delBtn.addEventListener('click', function () {
                removeScannedCode(targetId, idx, kod);
            });
            const label = document.createElement('span');
            label.textContent = kodQisqa;
            label.style.cssText = 'color:#475569; font-family:monospace;';
            item.appendChild(delBtn);
            item.appendChild(label);
            list.appendChild(item);
        });
    }

    function removeScannedCode(targetId, idx, kod) {
        const codes = getCodes(targetId).filter(function (k) { return k !== kod; });
        setCodes(targetId, codes);
        syncSerialCount(idx, targetId);
    }

    // Skanerlangan donalar soni asosida shu mahsulot qatorining miqdorini
    // (steppersiz, faqat QR bilan boshqariladigan qatorlar uchun) va umumiy
    // summani yangilaydi — `ytsot.html`/`sgsot.html`dagi umumiy `totals`/
    // `BY_IDX`/`recalc()` global o'zgaruvchilaridan foydalanadi.
    function syncSerialCount(idx, targetId) {
        if (!idx) return;
        const count = getCodes(targetId).length;
        const valEl = document.getElementById('pval' + idx);
        const inpEl = document.getElementById('pinp' + idx);
        const rowEl = document.getElementById('prow' + idx);
        if (valEl) valEl.textContent = count + ' dona';
        if (inpEl) inpEl.value = count;
        if (rowEl) rowEl.classList.toggle('selected', count > 0);
        if (typeof window.totals === 'object') window.totals[idx] = count;
        if (typeof totals === 'object') {
            try { totals[idx] = count; } catch (e) {}
        }
        if (typeof recalc === 'function') {
            try { recalc(); } catch (e) {}
        }
        renderScannedList(idx, targetId);
    }
    window.syncSerialCount = syncSerialCount;

    // html5-qrcode har muvaffaqiyatli o'qishda callback'ni QAYTA-QAYTA
    // chaqiraveradi (video oqim davom etadi) — status matni ko'z ilg'ay
    // olmaydigan tezlikda "yonib-o'chib" ketmasligi uchun bir xil kodni
    // qisqa vaqt ichida qayta ko'rsatmaymiz.
    let lastShownKod = null;
    let lastShownAt = 0;

    window.closeQrScanModal = function () {
        const modal = document.getElementById('qrScanModal');
        modal.style.display = 'none';
        setStatus('', '#166534');
        lastShownKod = null;
        if (html5QrCode) {
            html5QrCode.stop().catch(() => {});
        }
    };

    function openQrScanModal(targetId, idx, mahsulotId) {
        qrScanTargetId = targetId;
        qrScanIdx = idx;
        qrScanMahsulotId = mahsulotId;
        const modal = document.getElementById('qrScanModal');
        modal.style.display = 'flex';
        setStatus('Kamerani QR kodga qarating...', '#64748b');
        lastShownKod = null;
        if (typeof Html5Qrcode === 'undefined') {
            setStatus('Skaner kutubxonasi yuklanmadi — internetni tekshiring.', '#b91c1c');
            return;
        }
        html5QrCode = new Html5Qrcode('qrScanReaderBox');
        html5QrCode.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: 220 },
            (decodedText) => {
                if (validating) return;
                const kod = extractKod(decodedText);
                const now = Date.now();
                if (kod === lastShownKod && (now - lastShownAt) < 1500) {
                    return;
                }
                lastShownKod = kod;
                lastShownAt = now;

                const textarea = document.getElementsByName(qrScanTargetId)[0];
                if (!textarea) {
                    setStatus('Xato: maqsad maydon topilmadi.', '#b91c1c');
                    return;
                }
                const existing = textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
                const kodQisqa = kod.length > 10 ? kod.slice(0, 10) + '…' : kod;
                if (existing.includes(kod)) {
                    setStatus(`Bu QR kod allaqachon qo'shilgan (${kodQisqa}).`, '#b45309');
                    return;
                }

                // Har bir skanerlangan kod serverga tekshirilib chiqadi —
                // aynan shu mahsulotga tegishlimi va (yetkazib beruvchi
                // bo'lsa) aynan shu xodimning o'z yuklamasida bormi.
                // Shundan keyingina ro'yxatga qo'shiladi — begona/mos
                // kelmaydigan QR jimgina qabul qilinmasligi uchun.
                validating = true;
                setStatus('Tekshirilmoqda...', '#64748b');
                const params = new URLSearchParams({ kod: kod, mahsulot_id: qrScanMahsulotId || '' });
                fetch(CHECK_SALE_SERIAL_URL + '?' + params.toString(), { credentials: 'same-origin' })
                    .then(function (resp) { return resp.json(); })
                    .then(function (data) {
                        validating = false;
                        if (!data.valid) {
                            setStatus('✗ ' + (data.detail || 'Bu QR kod qabul qilinmadi.'), '#b91c1c');
                            return;
                        }
                        existing.push(kod);
                        textarea.value = existing.join('\n');
                        syncSerialCount(qrScanIdx, qrScanTargetId);
                        setStatus(`✓ Qo'shildi (${kodQisqa}) — jami ${existing.length} ta.`, '#166534');
                    })
                    .catch(function () {
                        validating = false;
                        setStatus('Tekshirishda tarmoq xatosi — qayta urinib ko\'ring.', '#b91c1c');
                    });
            },
            () => {}
        ).catch((err) => {
            setStatus('Kamerani ochib bo\'lmadi: ' + (err && err.message ? err.message : err), '#b91c1c');
        });
    }

    document.querySelectorAll('.btn-scan-qr').forEach(function (btn) {
        btn.addEventListener('click', function () {
            openQrScanModal(btn.dataset.target, btn.dataset.idx, btn.dataset.mahsulotId);
        });
    });

})();
</script>
